<!DOCTYPE html>
<html>
<head>
    <title>Campus Rides — Driver Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 48px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid #334155;
        }
        .logo { font-size: 32px; margin-bottom: 8px; }
        h1 { color: #f1f5f9; font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 36px; }
        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
            margin-top: 20px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button {
            width: 100%;
            padding: 13px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 28px;
        }
        button:hover { background: #2563eb; }
        .error {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🛺</div>
        <h1>Driver Portal</h1>
        <p class="subtitle">IIT Roorkee Campus Rides</p>

        <form method="POST" action="/driver/login">
            <label>Phone Number</label>
            <input
                type="tel"
                name="phone"
                placeholder="Registered phone number"
                required
                autocomplete="off"
            >

            <label>4-Digit PIN</label>
            <input
                type="password"
                name="pin"
                placeholder="Enter your PIN"
                maxlength="4"
                required
                autocomplete="off"
            >

            <button type="submit">Login →</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
