<!DOCTYPE html>
<html>
<head>
    <title>Campus Rides — Driver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 24px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .logo { color: #f1f5f9; font-size: 20px; font-weight: 700; }
        .name { color: #64748b; font-size: 14px; }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: #052e16;
            color: #4ade80;
            border: 1px solid #166534;
            margin-bottom: 32px;
        }
        .zone-display {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px 20px;
            color: #38bdf8;
            font-size: 15px;
            margin-bottom: 16px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-number { color: #f1f5f9; font-size: 32px; font-weight: 700; }
        .stat-label { color: #64748b; font-size: 12px; margin-top: 4px; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .card h2 { color: #f1f5f9; font-size: 16px; margin-bottom: 16px; }
        select {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-gray { background: #334155; color: #94a3b8; }
        .btn-gray:hover { background: #475569; }
        .btn-red { background: #dc2626; color: white; }
        .btn-red:hover { background: #b91c1c; }
        .waiting {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 32px 0;
        }
        .waiting-icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">🛺 Campus Rides</div>
        <div class="name">{{ driver_name }}</div>
    </div>

    <div class="badge">● ONLINE</div>

    <div class="zone-display">
        📍 Waiting at: <strong>{{ current_zone }}</strong>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-number">{{ ride_count }}</div>
            <div class="stat-label">Rides Today</div>
        </div>
        <div class="stat">
            <div class="stat-number">{{ penalty_seconds // 60 }}</div>
            <div class="stat-label">Penalty (mins)</div>
        </div>
    </div>

    <div class="waiting">
        <div class="waiting-icon">⏳</div>
        Waiting for ride requests...
    </div>

    <div class="card">
        <h2>Change Zone</h2>
        <form method="POST" action="/driver/zone">
            <select name="new_zone">
                {% for zone in zones %}
                <option value="{{ zone }}"
                    {% if zone == current_zone %}selected{% endif %}>
                    {{ zone }}
                </option>
                {% endfor %}
            </select>
            <button class="btn btn-gray" type="submit">Move to This Zone</button>
        </form>
    </div>

    <form method="POST" action="/driver/offline">
        <button class="btn btn-red" type="submit">Go Offline</button>
    </form>
</body>
</html>
